name: Release artifact signatures and provenance

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-provenance-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Build wheel and validate release model
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the published tag without persisting credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download and verify the release model without deserializing it
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir -p model-release
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.pkl' \
            --pattern '*.metadata.json' \
            --dir model-release
          shopt -s nullglob
          models=(model-release/*.pkl)
          if [[ "${#models[@]}" -ne 1 ]]; then
            echo "Expected exactly one .pkl model bundle in the published release." >&2
            exit 1
          fi
          model_path="${models[0]}"
          metadata_path="${model_path%.pkl}.metadata.json"
          if [[ ! -f "$metadata_path" ]]; then
            echo "The model bundle requires a same-stem .metadata.json sidecar." >&2
            exit 1
          fi
          python -m src.artifact_integrity "$model_path" --metadata "$metadata_path"

      - name: Build the wheel from the published tag
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Stage only the wheel, model bundle, and metadata sidecar
        run: |
          shopt -s nullglob
          models=(model-release/*.pkl)
          model_path="${models[0]}"
          metadata_path="${model_path%.pkl}.metadata.json"
          mkdir release-inputs
          cp dist/*.whl "$model_path" "$metadata_path" release-inputs/

      - name: Transfer release inputs to the signing job
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-inputs
          path: release-inputs/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sign-and-attest:
    name: Sign and attest exact release files
    needs: prepare
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Retrieve prepared release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: release-inputs

      - name: Recheck the model sidecar and upload the wheel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          wheels=(release-inputs/*.whl)
          models=(release-inputs/*.pkl)
          sidecars=(release-inputs/*.metadata.json)
          if [[ "${#wheels[@]}" -ne 1 || "${#models[@]}" -ne 1 || "${#sidecars[@]}" -ne 1 ]]; then
            echo "Expected one wheel, one model bundle, and one metadata sidecar." >&2
            exit 1
          fi
          model_path="${models[0]}"
          metadata_path="${sidecars[0]}"
          if [[ "$metadata_path" != "${model_path%.pkl}.metadata.json" ]]; then
            echo "The model metadata sidecar name does not match the model bundle." >&2
            exit 1
          fi
          expected_sha256="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["artifact_sha256"])' "$metadata_path")"
          if [[ ! "$expected_sha256" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "The model metadata sidecar has an invalid artifact_sha256." >&2
            exit 1
          fi
          actual_sha256="$(sha256sum "$model_path" | cut -d ' ' -f 1)"
          if [[ "$actual_sha256" != "${expected_sha256,,}" ]]; then
            echo "The model bundle does not match its sidecar SHA-256." >&2
            exit 1
          fi
          wheel_path="${wheels[0]}"
          wheel_name="$(basename "$wheel_path")"
          wheel_sha256="$(sha256sum "$wheel_path" | cut -d ' ' -f 1)"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")"
          existing_assets="$(jq --arg name "$wheel_name" '[.assets[] | select(.name == $name)]' <<< "$release_json")"
          existing_count="$(jq 'length' <<< "$existing_assets")"
          if [[ "$existing_count" -gt 1 ]]; then
            echo "The release has multiple assets named $wheel_name; refusing to continue." >&2
            exit 1
          elif [[ "$existing_count" -eq 1 ]]; then
            existing_digest="$(jq -r '.[0].digest // ""' <<< "$existing_assets")"
            if [[ -z "$existing_digest" ]]; then
              echo "The existing wheel asset has no verifiable SHA-256 digest." >&2
              exit 1
            fi
            if [[ "$existing_digest" != "sha256:$wheel_sha256" ]]; then
              echo "A release asset named $wheel_name has different bytes; refusing to overwrite it." >&2
              exit 1
            fi
            echo "The existing wheel release asset matches; skipping upload."
          else
            gh release upload "$RELEASE_TAG" "$wheel_path" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Create GitHub build provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-inputs/*.whl
            release-inputs/*.pkl
            release-inputs/*.metadata.json

      - name: Sign release files with keyless Sigstore and verify the signatures
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            release-inputs/*.whl
            release-inputs/*.pkl
            release-inputs/*.metadata.json
          verify: true
          verify-cert-identity: https://github.com/${{ github.repository }}/.github/workflows/release-provenance.yml@${{ github.ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          release-signing-artifacts: true
