name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no repository secrets or write tokens are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-smoke:
    name: Installed wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, install, and smoke-test wheel outside checkout
        run: python scripts/wheel_smoke.py

  browser-smoke:
    name: Browser behavior smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -c constraints/py3.12.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependency
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise UI in Chromium
        run: npm run test:browser

  deployment-smoke:
    name: Container smoke test (missing-model behavior)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python for a synthetic smoke model
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -c constraints/py3.12.txt
      - name: Train an explicitly synthetic fixture artifact
        run: |
          python -m src.train \
            --data data/raw/ph_supplement.csv \
            --supplement data/raw/ph_supplement_2.csv data/raw/ph_supplement_3.csv data/raw/ph_supplement_4.csv data/raw/ph_supplement_5.csv \
            --holdout none \
            --output models/ci-smoke.pkl \
            --model-version ci-synthetic-smoke
      - name: Build runtime image
        run: docker build --tag smsd-ci-smoke .
      - name: Verify liveness and readiness contracts
        run: |
          docker run --detach --rm --name smsd-ci-smoke -p 127.0.0.1:8000:8000 smsd-ci-smoke
          trap 'docker stop smsd-ci-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(f"{base}/health", timeout=2) as response:
                      assert response.status == 200
                      break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          else:
              raise AssertionError("health endpoint did not become ready")

          try:
              urllib.request.urlopen(f"{base}/ready", timeout=2)
          except urllib.error.HTTPError as response:
              assert response.code == 503
              assert b"model_unavailable" in response.read()
          else:
              raise AssertionError("readiness must fail when the model artifact is absent")
          PY
      - name: Verify production readiness and prediction contracts with fixture model
        run: |
          docker run --detach --rm --name smsd-ci-fixture \
            -p 127.0.0.1:8001:8000 \
            -v "$PWD/models:/app/models:ro" \
            -e SMSD_MODEL_PATH=/app/models/ci-smoke.pkl \
            -e SMSD_ENV=production \
            smsd-ci-smoke
          trap 'docker stop smsd-ci-fixture >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8001"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(f"{base}/ready", timeout=2) as response:
                      assert response.status == 200
                  break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(1)

          def post(path, body):
              request = urllib.request.Request(
                  f"{base}{path}", data=json.dumps(body).encode(),
                  headers={"Content-Type": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=5) as response:
                  return json.load(response)

          info = json.load(urllib.request.urlopen(f"{base}/model-info", timeout=2))
          assert info["model_version"] == "ci-synthetic-smoke"
          assert info["feature_version"] != "unknown"
          assert post("/predict", {"message": "CI fixture message"})["prediction"] in {"ham", "spam"}
          assert post("/analyze", {"message": "CI fixture message"})["prediction"] in {"ham", "spam"}
          assert len(post("/analyze/batch", {"messages": ["fixture one", "fixture two"]})["results"]) == 2
          with urllib.request.urlopen(f"{base}/", timeout=2) as response:
              assert response.status == 200 and b"SMS" in response.read()
          for path, expected in {
              "/static/styles.css": b"text/css",
              "/static/app.js": b"javascript",
              "/static/icon.svg": b"svg",
              "/manifest.webmanifest": b"application/manifest+json",
              "/sw.js": b"javascript",
          }.items():
              with urllib.request.urlopen(f"{base}{path}", timeout=2) as response:
                  assert response.status == 200
                  assert expected in response.headers.get("Content-Type", "").encode().lower()

          secret = "DO_NOT_ECHO_CI_MESSAGE"
          request = urllib.request.Request(
              f"{base}/predict", data=json.dumps({"message": secret + "x" * 10000}).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as response:
              assert secret.encode() not in response.read()
          else:
              raise AssertionError("unexpected request field should be rejected")
          PY

  uci-quality-gate:
    name: UCI train + F1 >= 0.90 gate
    runs-on: ubuntu-latest
    env:
      UCI_URL: https://archive.ics.uci.edu/static/public/228/sms+spam+collection.zip
      # SHA-256 of the UCI SMS Spam Collection archive (CC BY 4.0), verified 2026-10-21.
      UCI_ZIP_SHA256: 1587ea43e58e82b14ff1f5425c88e17f8496bfcdb67a583dbff9eefaf9963ce3
      UCI_TSV_SHA256: 7d039a24a6083ed9ef0f806ebad56bbb976e3aeb8de05669173bfdc4996c239d
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt -c constraints/py3.12.txt
      - name: Restore cached UCI archive
        id: uci-cache
        uses: actions/cache@v4
        with:
          path: .cache/uci
          key: uci-sms-spam-${{ env.UCI_ZIP_SHA256 }}
      - name: Download UCI SMS Spam Collection (CC BY 4.0)
        if: steps.uci-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/uci
          curl --fail --location --retry 3 --silent --show-error -o .cache/uci/smsspamcollection.zip "$UCI_URL"
      - name: Verify archive and extracted file hashes
        run: |
          echo "$UCI_ZIP_SHA256  .cache/uci/smsspamcollection.zip" | sha256sum --check --strict
          unzip -o -q .cache/uci/smsspamcollection.zip SMSSpamCollection -d .cache/uci
          echo "$UCI_TSV_SHA256  .cache/uci/SMSSpamCollection" | sha256sum --check --strict
      - name: Import with attribution
        run: python -m src.import_public_dataset --input .cache/uci/SMSSpamCollection --format uci-tsv
      - name: Train on UCI + tracked synthetic PH supplements
        run: |
          python -m src.train \
            --data data/raw/imported/uci_sms_spam.csv \
            --output models/uci-ci.pkl \
            --metadata-output models/uci-ci.metadata.json \
            --model-version ci-uci-gate
      - name: Fail if internal test F1 < 0.90
        run: python scripts/check_quality_gate.py models/uci-ci.metadata.json --min-f1 0.90

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c "constraints/py${{ matrix.python-version }}.txt"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src api

      # The data/raw/spam.csv base corpus and models/*.pkl artifact are
      # git-ignored and therefore absent in CI (only the synthetic Philippine
      # CSVs are tracked). Tests must synthesize tiny datasets or skip when
      # those paths are missing; no step here downloads data or trains on the
      # full corpus.
      - name: Tests (pytest)
        run: pytest -q
