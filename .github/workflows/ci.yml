name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no repository secrets or write tokens are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src api

      # The data/raw/spam.csv base corpus and models/*.pkl artifact are
      # git-ignored and therefore absent in CI (only the synthetic Philippine
      # CSVs are tracked). Tests must synthesize tiny datasets or skip when
      # those paths are missing; no step here downloads data or trains on the
      # full corpus.
      - name: Tests (pytest)
        run: pytest -q
