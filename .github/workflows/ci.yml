name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: no repository secrets or write tokens are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-smoke:
    name: Container smoke test (missing-model behavior)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --tag smsd-ci-smoke .
      - name: Verify liveness and readiness contracts
        run: |
          docker run --detach --rm --name smsd-ci-smoke -p 127.0.0.1:8000:8000 smsd-ci-smoke
          trap 'docker stop smsd-ci-smoke >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(f"{base}/health", timeout=2) as response:
                      assert response.status == 200
                      break
              except (OSError, urllib.error.URLError):
                  if attempt == 29:
                      raise
                  time.sleep(1)
          else:
              raise AssertionError("health endpoint did not become ready")

          try:
              urllib.request.urlopen(f"{base}/ready", timeout=2)
          except urllib.error.HTTPError as response:
              assert response.code == 503
              assert b"model_unavailable" in response.read()
          else:
              raise AssertionError("readiness must fail when the model artifact is absent")
          PY

  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src api

      # The data/raw/spam.csv base corpus and models/*.pkl artifact are
      # git-ignored and therefore absent in CI (only the synthetic Philippine
      # CSVs are tracked). Tests must synthesize tiny datasets or skip when
      # those paths are missing; no step here downloads data or trains on the
      # full corpus.
      - name: Tests (pytest)
        run: pytest -q
