name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly disclosed advisories surface without a push.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: this workflow reads code and dependency metadata only.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install constrained runtime dependencies
        run: python -m pip install -r requirements.txt -c constraints/py3.12.txt
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit installed Python packages
        run: python -m pip_audit
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
